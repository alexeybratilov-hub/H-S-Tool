[build-system]
# PEP 517/518 build system requirements
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# PEP 621 project metadata
name = "H-S-Tool"
description = "Local-first Occupational Health & Safety (OHS) compliance assistant for Russian regulations"
readme = "README.md"
license = {text = "Proprietary"}
requires-python = ">=3.11"
authors = [
    {name = "H-S-Tool Team", email = "technical@hstool.example"}
]
keywords = [
    "occupational-health",
    "safety",
    "compliance",
    "local-first",
    "offline",
    "russian-regulations",
    "ot",
    "ohs",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Legal Industry",
    "Intended Audience :: Other Audience",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Topic :: Utilities",
]
dynamic = ["version"]

dependencies = [
    "streamlit>=1.65.0,<2.0.0",
    "pandas>=3.0.0,<4.0.0",
    "numpy>=2.5.0,<3.0.0",
]

[project.optional-dependencies]
# Optional dependencies for extended functionality
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=24.0.0",
    "mypy>=1.10.0",
    "ruff>=0.4.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
]
pdf = [
    "pdfplumber>=0.10.0",
]
docx = [
    "python-docx>=1.1.0",
]

[project.scripts]
# CLI entry points
hs-tool = "hs_tool.cli:main"
hs-doctor = "hs_tool.diagnostics:doctor"
hs-license-check = "tools.license_report:main"
hs-sbom = "tools.sbom_generate:main"

[project.urls]
Homepage = "https://hstool.example"
Documentation = "https://hstool.example/docs"
Repository = "https://github.com/alexeybratilov-hub/H-S-Tool"
Issues = "https://github.com/alexeybratilov-hub/H-S-Tool/issues"

[tool.setuptools]
# Setuptools configuration
package-dir = {"" = ".", "hs_tool" = "src/hs_tool"}
packages = ["hs_tool", "hs_tool.domain", "hs_tool.application", "hs_tool.infrastructure", "hs_tool.interfaces"]
include-package-data = true

[tool.setuptools.package-data]
# Include non-Python files
hs_tool = ["templates/*", "static/*", "data/*"]

[tool.black]
# Black code formatter configuration
line-length = 100
target-version = ["py311", "py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.venv
    | build
    | dist
    | __pycache__
    | \.mypy_cache
    | \.pytest_cache
)/
'''

[tool.ruff]
# Ruff linter configuration
line-length = 100
target-version = "py311"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "S",   # flake8-bandit (security)
    "BLE", # flake8-blind-except
    "FBT", # flake8-boolean-trap
    "A",   # flake8-builtins
    "COM", # flake8-commas
    "C90", # mccabe complexity
    "ICN", # flake8-import-conventions
    "INP", # flake8-no-pep420
    "PIE", # flake8-pie
    "T20", # flake8-print
    "PYI", # flake8-pyi
    "PT",  # flake8-pytest-style
    "Q",   # flake8-quotes
    "RSE", # flake8-raise
    "RET", # flake8-return
    "SLF", # flake8-self
    "SIM", # flake8-simplify
    "TID", # flake8-tidy-imports
    "ARG", # flake8-unused-arguments
    "PLC", # pylint conventions
    "PLE", # pylint errors
    "PLW", # pylint warnings
    "TRY", # tryceratops
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
    "S101",  # Use of assert detected
    "PLR0913", # Too many arguments
    "PLR0912", # Too many branches
    "PLR0915", # Too many statements
]

[tool.mypy]
# MyPy static type checker configuration
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true

# Ignore missing imports for third-party libraries
ignore_missing_imports = true

[tool.pytest.ini_options]
# Pytest configuration
python_files = ["test_*.py", "*_test.py"]
addopts = "-v --tb=short --color=yes --durations=10"
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow",
    "integration: marks integration tests",
    "unit: marks unit tests",
    "security: marks security tests",
    "licensing: marks licensing tests",
]

[tool.coverage.run]
# Coverage.py configuration
source = ["src/hs_tool"]
branch = true
parallel = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
]
ignore_errors = true

[tool.coverage.html]
directory = "htmlcov"
